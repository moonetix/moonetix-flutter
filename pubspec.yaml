name: moonetix_offerwall
description: Show the Moonetix offerwall in your Flutter app. Your server creates a single-use session token, and the plugin opens the offerwall with it.
version: 2.0.1
homepage: https://docs.moonetix.com/flutter-sdk

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.moonetix.offerwall.flutter
        pluginClass: MoonetixOfferwallPlugin
      ios:
        pluginClass: MoonetixOfferwallPlugin
